[project]
name = "pg-star-schema"
version = "0.1.0"
description = "Automatically create and manage a star schema on top of existing Postgres tables"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sergey Kapustin", email = "kapustin.sergey@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["postgres", "postgresql", "star-schema", "olap", "data-warehouse", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = [
    "psycopg[binary]>=3.3.4",
]

[project.urls]
Repository = "https://github.com/kapustinsergey/pg-star-schema"
Issues = "https://github.com/kapustinsergey/pg-star-schema/issues"

[project.scripts]
pg-star-schema = "pg_star_schema.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
